name: Release

# Publishes a release automatically whenever main has a version (package.json) that
# is not released yet. The app's update button reads these releases:
#   app.asar                 small update (Electron runtime unchanged)
#   Notenpult-win32-x64.zip  complete app
#   update.json              { version, electron }
#   Notenpult-android.apk    Android app, signed with the key from the repository secrets
#                            NOTENPULT_KEYSTORE_BASE64 / NOTENPULT_KEYSTORE_PASSWORD (added by the second job)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release bei neuer Version
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      apk: ${{ steps.version.outputs.apk }}
    steps:
      - uses: actions/checkout@v5

      - name: Neue Version?
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "publish=false" >> $env:GITHUB_OUTPUT
            $assets = gh release view "v$v" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
            if ($assets -notcontains 'Notenpult-android.apk') {
              "apk=true" >> $env:GITHUB_OUTPUT
              Write-Host "v$v ist veröffentlicht, die Android-App fehlt noch."
            } else {
              Write-Host "v$v ist schon veröffentlicht – nichts zu tun."
            }
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
            "apk=true" >> $env:GITHUB_OUTPUT
            Write-Host "Neue Version v$v wird veröffentlicht."
          }
          $global:LASTEXITCODE = 0

      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - if: steps.version.outputs.publish == 'true'
        run: npm ci

      - if: steps.version.outputs.publish == 'true'
        run: npm test

      - if: steps.version.outputs.publish == 'true'
        run: npm run package

      - name: Release-Dateien
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          Compress-Archive -Path dist/Notenpult-win32-x64/* -DestinationPath Notenpult-win32-x64.zip
          Copy-Item dist/Notenpult-win32-x64/resources/app.asar app.asar
          $electron = (Get-Content node_modules/electron/package.json -Raw | ConvertFrom-Json).version
          @{ version = $v; electron = $electron } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM update.json
          node scripts/release-notes.js $v | Set-Content -Encoding utf8NoBOM notes.md
          Get-Content update.json

      - name: Veröffentlichen
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          Notenpult-win32-x64.zip app.asar update.json
          --target "${{ github.sha }}"
          --title "Notenpult ${{ steps.version.outputs.version }}"
          --notes-file notes.md

  android:
    name: Android-App zum Release
    needs: release
    if: needs.release.outputs.apk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: node scripts/build-android-web.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signierte APK bauen
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTENPULT_KEYSTORE_BASE64 }}
          NOTENPULT_KEYSTORE_PASSWORD: ${{ secrets.NOTENPULT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Secret NOTENPULT_KEYSTORE_BASE64 fehlt"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/notenpult.p12"
          export NOTENPULT_KEYSTORE_FILE="$RUNNER_TEMP/notenpult.p12"
          gradle -p android --no-daemon testReleaseUnitTest assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk Notenpult-android.apk
          rm -f "$RUNNER_TEMP/notenpult.p12"

      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.release.outputs.version }}" Notenpult-android.apk --clobber --repo "${{ github.repository }}"
