name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Windows-Release bauen
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run package

      - name: ZIP erstellen
        shell: pwsh
        run: Compress-Archive -Path dist/Notenpult-win32-x64/* -DestinationPath Notenpult-win32-x64.zip

      - name: GitHub-Release anlegen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Notenpult-win32-x64.zip --title "Notenpult ${{ github.ref_name }}" --generate-notes
